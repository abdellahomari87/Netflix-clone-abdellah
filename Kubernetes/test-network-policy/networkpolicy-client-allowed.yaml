apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-client-allowed-egress
  namespace: netflix
spec:
  podSelector:
    matchLabels:
      access: allowed
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app: nginx
      ports:
        - protocol: TCP
          port: 80
